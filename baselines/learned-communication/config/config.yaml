# experiment params
"BASELINE": "ic3net" # ic, iric, commnet or ic3net
"MEAN_RATIO": null # weight of the team's mean return; null uses the baseline's (1 for ic and commnet, 0 for iric and ic3net)
"NUM_SEEDS": 1 # number of vmapped seeds
"SEED_CHUNK": null # train the seeds this many at a time, to fit in memory; null trains them all at once
"LSTM": False # ic and iric: an LSTM as in the paper rather than the tanh RNN of the reference's commands; commnet and ic3net always use one
"SEED": 0

# wandb params
"ENTITY": ""
"PROJECT": ""
"WANDB_MODE": "disabled"
"WANDB_LOG_ALL_SEEDS": False # will log separately the vmapped seeds

# where to save the params (if None, will not save)
"SAVE_PATH": null
