"ENV_NAME": "traffic_junction_grid"
"ENV_KWARGS": {"difficulty": "hard", "max_steps": 60} # the paper's; the reference's command and the environment default use 80

# Each update runs NUM_ENVS episodes of up to NUM_STEPS steps; the reference
# runs 16 processes that each collect at least 500 steps of whole episodes.
"NUM_ENVS": 133
"NUM_STEPS": 60
"TOTAL_TIMESTEPS": 1.596e8 # simulated steps: 20,000 updates, the reference's and the paper's 2,000 epochs of 10
"HIDDEN_SIZE": 128
"COMM_PASSES": 1
"COMM_ACTION_ONE": True # ic3net agents always talk, as the reference does in Traffic Junction
"LR": 0.003 # the paper's; the reference's commands use 0.001
"GAMMA": 1.0
"VALUE_COEF": 0.01
"ENT_COEF": 0.0
"DETACH_GAP": 10 # steps of backpropagation through time
