"ENV_NAME": "predator_prey_grid"
"ENV_KWARGS": {"num_agents": 5, "dim": 10, "vision": 1, "max_steps": 40, "mode": "mixed"}

# Each update runs NUM_ENVS episodes of up to NUM_STEPS steps; the reference
# runs 16 processes that each collect at least 500 steps of whole episodes.
"NUM_ENVS": 200
"NUM_STEPS": 40
"TOTAL_TIMESTEPS": 8e7 # simulated steps: 10,000 updates, the paper's 1,000 epochs of 10; the reference's commands train 2,000
"HIDDEN_SIZE": 128
"COMM_PASSES": 1
"COMM_ACTION_ONE": False # ic3net agents choose when to talk; the reference makes them always talk only in Traffic Junction
"LR": 0.001 # the reference's commands; the paper tunes it and gives it only for Traffic Junction
"GAMMA": 1.0
"VALUE_COEF": 0.01
"ENT_COEF": 0.0
"DETACH_GAP": 10 # steps of backpropagation through time
