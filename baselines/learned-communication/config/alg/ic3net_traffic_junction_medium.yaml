"ENV_NAME": "traffic_junction_grid"
"ENV_KWARGS": {"difficulty": "medium"}

# Each update runs NUM_ENVS episodes of up to NUM_STEPS steps; the reference
# runs 16 processes that each collect at least 500 steps of whole episodes.
"NUM_ENVS": 200
"NUM_STEPS": 40
"TOTAL_TIMESTEPS": 1.6e8 # simulated steps: 20,000 updates, the reference's and the paper's 2,000 epochs of 10
"HIDDEN_SIZE": 128
"COMM_PASSES": 1
"COMM_ACTION_ONE": True # ic3net agents always talk, as the reference does in Traffic Junction
"LR": 0.001 # the reference's commands; the paper gives 0.003 for Traffic Junction
"GAMMA": 1.0
"VALUE_COEF": 0.01
"ENT_COEF": 0.0
"DETACH_GAP": 10 # steps of backpropagation through time

# The paper raises add_rate from 0.05 to 0.2 in steps of 0.01 between epochs 250
# and 1250 of 2000. The reference's instructions give a maximum of 0.02, below the
# minimum, which disables its curriculum.
"CURRICULUM": {"KEY": "add_rate", "START": 0.05, "END": 0.2, "STEP": 0.01, "BEGIN": 0.125, "FINISH": 0.625}
